<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<title>Ajustes</title>



<style>
body{margin:0}
a{color:#12645A}a:hover{color:#0C4A42}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;700&display=swap"></head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F4EE; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #1D2422; display: flex; flex-direction: column; overflow: hidden">

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-family: Lexend, sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.01em">Ajustes</h1>

    <a href="Entrar.html" style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E4E0D6; border-radius: 18px; padding: 12px 14px; text-decoration: none; color: #1D2422">
      <span aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 999px; background: #EFECE4; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#555E5A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4.2-6 8-6s7 2 8 6"></path></svg>
      </span>
      <span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 700; font-size: 17px">Jogando como convidado</span><span style="font-size: 15px; color: #555E5A">Entre para usar em todos os aparelhos</span></span>
      <span style="flex: none; font-size: 16px; font-weight: 700; color: #12645A">Entrar</span>
    </a>

    <section style="background: #FFFFFF; border: 1px solid #E4E0D6; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
      <fieldset style="border: 0; margin: 0; padding: 0">
        <legend style="font-family: Lexend, sans-serif; font-weight: 500; font-size: 17px; margin-bottom: 8px">Tamanho do texto</legend>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <label style="height: 50px; border-radius: 14px; border: 1px solid #E4E0D6; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 16px; cursor: pointer"><input type="radio" name="tamanho" style="accent-color: #12645A; width: 18px; height: 18px; margin: 0">Normal</label>
          <label style="height: 50px; border-radius: 14px; border: 2px solid #12645A; background: #DDEFEA; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 18px; font-weight: 700; cursor: pointer"><input type="radio" name="tamanho" checked="" style="accent-color: #12645A; width: 18px; height: 18px; margin: 0">Grande</label>
          <label style="height: 50px; border-radius: 14px; border: 1px solid #E4E0D6; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 16px; cursor: pointer"><input type="radio" name="tamanho" style="accent-color: #12645A; width: 18px; height: 18px; margin: 0">Maior</label>
        </div>
      </fieldset>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <label for="idioma" style="font-family: Lexend, sans-serif; font-weight: 500; font-size: 17px">Idioma</label>
        <select id="idioma" style="height: 46px; border-radius: 12px; border: 1px solid #D8D2C4; background: #FFFFFF; padding: 0 10px; font: inherit; font-size: 16px; color: #1D2422">
          <option selected="">Português (Brasil)</option>
          <option>Español</option>
          <option>English</option>
        </select>
      </div>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E4E0D6; border-radius: 18px; padding: 2px 16px">
      <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; border-bottom: 1px solid #EFECE4; cursor: pointer">
        <span><span style="display: block; font-size: 17px; font-weight: 700">Modo tranquilo</span><span style="font-size: 14px; color: #555E5A">Esconde o cronômetro e os erros</span></span>
        <input type="checkbox" role="switch" checked="" style="accent-color: #12645A; width: 22px; height: 22px; margin: 0; flex: none">
      </label>
      <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; border-bottom: 1px solid #EFECE4; font-size: 17px; cursor: pointer">Alto contraste<input type="checkbox" role="switch" style="accent-color: #12645A; width: 22px; height: 22px; margin: 0"></label>
      <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; font-size: 17px; cursor: pointer">Lembrete do desafio diário<input type="checkbox" role="switch" checked="" style="accent-color: #12645A; width: 22px; height: 22px; margin: 0"></label>
    </section>

    <a href="Premium.html" style="display: flex; align-items: center; gap: 12px; background: #DDEFEA; border-radius: 18px; padding: 14px 16px; text-decoration: none; color: #1D2422">
      <span aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12645A" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>
      </span>
      <span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 700; font-size: 17px">Jogar sem anúncios</span><span style="font-size: 15px; color: #2F4A44">A partir de R$ 7,90, pagamento único</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2F4A44" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>

    <nav aria-label="Informações" style="display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 15px; padding: 0 4px">
      <a href="#" style="padding: 6px 0">Sugira um tema</a>
      <a href="#" style="padding: 6px 0">Privacidade</a>
      <a href="#" style="padding: 6px 0">Cookies</a>
      <a href="#" style="padding: 6px 0">Termos</a>
    </nav>
  </main>

  <nav aria-label="Navegação principal" style="flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E4E0D6; padding: 6px 6px 14px">
    <a href="Main.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; text-decoration: none; color: #555E5A; font-size: 14px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#555E5A" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"></path></svg>Início</a>
    <a href="Jogos.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; text-decoration: none; color: #555E5A; font-size: 14px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#555E5A" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></svg>Jogos</a>
    <a href="Desafio.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; text-decoration: none; color: #555E5A; font-size: 14px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#555E5A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M8 3v4M16 3v4M4 10h16"></path></svg>Desafio</a>
    <a href="Ajustes.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; text-decoration: none; color: #12645A; font-size: 14px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#12645A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2" fill="#DDEFEA"></circle><circle cx="10" cy="17" r="2" fill="#DDEFEA"></circle></svg>Ajustes</a>
  </nav>
</div>
