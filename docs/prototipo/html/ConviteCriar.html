<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<title>Desafiar um amigo</title>



<style>
body{margin:0}
a{color:#12645A}a:hover{color:#0C4A42}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;700&display=swap"></head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F4EE; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #1D2422; display: flex; flex-direction: column; overflow: hidden">

  <header style="flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 16px 8px">
    <a href="Damas.html" aria-label="Voltar para Damas" style="flex: none; width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E4E0D6; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D2422" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="font-family: Lexend, sans-serif; font-weight: 700; font-size: 19px">Desafiar um amigo</span>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 16px">
      <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true"><rect x="2" y="2" width="68" height="68" rx="14" fill="#F1E4CC"></rect><g fill="#B07F52"><rect x="19" y="2" width="17" height="17"></rect><rect x="53" y="2" width="17" height="17"></rect><rect x="2" y="19" width="17" height="17"></rect><rect x="36" y="19" width="17" height="17"></rect><rect x="19" y="36" width="17" height="17"></rect><rect x="53" y="36" width="17" height="17"></rect><rect x="2" y="53" width="17" height="17"></rect><rect x="36" y="53" width="17" height="17"></rect></g><circle cx="27.5" cy="10.5" r="6" fill="#2A2F2D"></circle><circle cx="44.5" cy="27.5" r="6" fill="#2A2F2D"></circle><circle cx="27.5" cy="44.5" r="6" fill="#FFFFFF" stroke="#8A2F1C" stroke-width="1.4"></circle><circle cx="44.5" cy="61.5" r="6" fill="#FFFFFF" stroke="#8A2F1C" stroke-width="1.4"></circle></svg>
      <h1 style="margin: 0; font-family: Lexend, sans-serif; font-weight: 700; font-size: 23px; line-height: 1.25">Jogue damas com alguém que você conhece</h1>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
      <legend style="font-family: Lexend, sans-serif; font-weight: 500; font-size: 18px; margin-bottom: 10px">Como vocês vão jogar</legend>
      <label style="display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 16px; border: 2px solid #12645A; background: #DDEFEA; cursor: pointer">
        <input type="radio" name="modo" checked="" style="accent-color: #12645A; width: 20px; height: 20px; margin: 2px 0 0">
        <span><span style="display: block; font-weight: 700; font-size: 17px">No seu tempo</span><span style="font-size: 15px; color: #2F4A44">Cada um joga quando puder. Avisamos quando for a vez de cada um.</span></span>
      </label>
      <label style="display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 16px; border: 1px solid #E4E0D6; background: #FFFFFF; cursor: pointer">
        <input type="radio" name="modo" style="accent-color: #12645A; width: 20px; height: 20px; margin: 2px 0 0">
        <span><span style="display: block; font-weight: 700; font-size: 17px">Agora, ao vivo</span><span style="font-size: 15px; color: #555E5A">Os dois jogam ao mesmo tempo.</span></span>
      </label>
    </fieldset>

    <fieldset style="border: 0; margin: 0; padding: 0">
      <legend style="font-family: Lexend, sans-serif; font-weight: 500; font-size: 18px; margin-bottom: 10px">Suas peças</legend>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <label style="height: 52px; border-radius: 14px; border: 2px solid #12645A; background: #DDEFEA; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700; cursor: pointer"><input type="radio" name="pecas" checked="" style="accent-color: #12645A; width: 18px; height: 18px; margin: 0">Claras</label>
        <label style="height: 52px; border-radius: 14px; border: 1px solid #E4E0D6; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; cursor: pointer"><input type="radio" name="pecas" style="accent-color: #12645A; width: 18px; height: 18px; margin: 0">Escuras</label>
        <label style="height: 52px; border-radius: 14px; border: 1px solid #E4E0D6; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; cursor: pointer"><input type="radio" name="pecas" style="accent-color: #12645A; width: 18px; height: 18px; margin: 0">Sortear</label>
      </div>
      <p style="margin: 8px 0 0; font-size: 14px; color: #555E5A">As claras começam.</p>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: auto">
      <a href="ConviteWhatsApp.html" style="height: 56px; border-radius: 16px; background: #12645A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 700; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M12 3v12M7 8l5-5 5 5"></path></svg>
        Enviar convite
      </a>
      <button type="button" style="height: 52px; border-radius: 16px; border: 1px solid #D8D2C4; background: #FFFFFF; color: #1D2422; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer">Copiar link</button>
      <p style="margin: 2px 0 0; font-size: 14px; line-height: 1.45; color: #555E5A; text-align: center">Seu amigo joga sem cadastro. O link vale só para esta partida.</p>
    </div>
  </main>
</div>




</body></html>
