<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<title>Fim da partida e revanche</title>



<style>
body{margin:0}
a{color:#12645A}a:hover{color:#0C4A42}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;700&display=swap"></head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F4EE; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #1D2422; display: flex; flex-direction: column; overflow: hidden">

  <header style="flex: none; display: flex; justify-content: flex-end; padding: 14px 16px 0">
    <a href="Main.html" aria-label="Fechar e ir para o início" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E4E0D6; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D2422" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 0 20px 20px; display: flex; flex-direction: column; gap: 16px">
    <section aria-labelledby="resultado" style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
      <div style="display: flex; align-items: center; gap: 18px">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span aria-hidden="true" style="width: 60px; height: 60px; border-radius: 999px; background: #CFD8E8; color: #273F8F; display: flex; align-items: center; justify-content: center; font-family: Lexend, sans-serif; font-weight: 700; font-size: 24px; box-shadow: 0 0 0 4px #F2B33D">B</span>
          <span style="font-size: 15px; font-weight: 700">Você</span>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span aria-hidden="true" style="width: 60px; height: 60px; border-radius: 999px; background: #FCEFD2; color: #6B4A00; display: flex; align-items: center; justify-content: center; font-family: Lexend, sans-serif; font-weight: 700; font-size: 24px">A</span>
          <span style="font-size: 15px; font-weight: 700">Ana</span>
        </div>
      </div>
      <h1 id="resultado" style="margin: 4px 0 0; font-family: Lexend, sans-serif; font-weight: 700; font-size: 28px">Você venceu a Ana!</h1>
      <p style="margin: 0; font-size: 16px; color: #555E5A">Partida de damas · 34 lances</p>
    </section>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <a href="Damas.html" style="height: 56px; border-radius: 16px; background: #12645A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 700; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"></path></svg>

      </a>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <a href="ConviteCriar.html" style="height: 52px; border-radius: 16px; border: 1px solid #D8D2C4; background: #FFFFFF; color: #1D2422; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; text-decoration: none">Desafiar outro amigo</a>
        <button type="button" style="height: 52px; border-radius: 16px; border: 1px solid #D8D2C4; background: #FFFFFF; color: #1D2422; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Compartilhar</button>
      </div>
    </div>

    <section style="background: #FFFFFF; border: 1px solid #E4E0D6; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 16px; font-weight: 700; color: #555E5A">Enquanto a Ana não joga</h2>
      <a href="CacaPalavras.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #1D2422">
        <span aria-hidden="true" style="flex: none; width: 46px; height: 46px; border-radius: 14px; background: #FCEFD2; display: flex; align-items: center; justify-content: center; font-family: Lexend, sans-serif; font-weight: 700; font-size: 17px; color: #6B4A00">Aa</span>
        <span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 700; font-size: 17px">Desafio de hoje</span><span style="font-size: 15px; color: #555E5A">Caça-palavras: Frutas do Brasil</span></span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#555E5A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
    </section>

    <section style="background: #DDEFEA; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div>
        <h2 style="margin: 0; font-family: Lexend, sans-serif; font-weight: 700; font-size: 18px">Guarde o placar com a Ana</h2>
        <p style="margin: 4px 0 0; font-size: 15px; line-height: 1.45; color: #2F4A44">Crie uma conta grátis para ser avisado quando for sua vez e jogar em qualquer aparelho.</p>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" style="height: 48px; border-radius: 14px; border: 0; background: #12645A; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Entrar com Google</button>
        <button type="button" style="height: 48px; border-radius: 14px; border: 1px solid #12645A; background: #FFFFFF; color: #12645A; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Usar e-mail</button>
      </div>
    </section>
  </main>
</div>




</body></html>
