# Integração contínua (FDD 001 §8.6, ADR-0012). Nada é publicado por aqui (ADR-0009).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:styles
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
      # Build de produção (sem jogos ocultos): precisa passar sozinho.
      - run: pnpm build
      # Build com o jogo de exemplo, usado pelos testes de HTML, e2e e Lighthouse.
      - run: pnpm build:hidden
      - run: pnpm test:html
      - run: pnpm --filter @zuploop/web exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      # Metas do FDD §9: LCP ≤ 2,5 s, CLS ≤ 0,1, acessibilidade 100, JS inicial ≤ 150 KB.
      - run: pnpm --filter @zuploop/web test:lighthouse
      - name: Relatórios dos testes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-reports
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/.lighthouseci
          retention-days: 7

  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: zuploop
          POSTGRES_PASSWORD: senha-falsa-de-teste
          POSTGRES_DB: zuploop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zuploop -d zuploop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Valores falsos, só para o banco de teste do CI (nunca segredos reais).
      POSTGRES_USER: zuploop
      POSTGRES_PASSWORD: senha-falsa-de-teste
      POSTGRES_DB: zuploop_test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests migrations
      - run: uv run alembic upgrade head
      - run: uv run pytest

  docker:
    name: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Só gera as imagens, sem publicar (ADR-0009); o cache de camadas fica no próprio Actions.
      - name: Imagem do site
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          tags: zuploop-web:ci
          load: true
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Imagem da API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          tags: zuploop-api:ci
          load: true
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      # Cabeçalhos de segurança, cache, 404 por idioma e /config.json na imagem do site.
      - run: scripts/smoke-web.sh
        env:
          SMOKE_IMAGE: zuploop-web:ci
      # A imagem da API sobe, aplica as migrações e responde /health e /ready.
      - run: scripts/smoke-api.sh
        env:
          SMOKE_IMAGE: zuploop-api:ci

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Histórico completo: o gitleaks procura segredos em todos os commits.
          fetch-depth: 0
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1
