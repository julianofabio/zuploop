# Integração contínua (FDD 001 §8.6, ADR-0012). Nada é publicado por aqui (ADR-0009).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:styles
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
      # Build de produção (sem jogos ocultos): precisa passar sozinho.
      - run: pnpm build
      # Build com o jogo de exemplo, usado pelos testes de HTML, e2e e Lighthouse.
      - run: pnpm build:hidden
      - run: pnpm test:html
      - run: pnpm --filter @zuploop/web exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      # Metas do FDD §9: LCP ≤ 2,5 s, CLS ≤ 0,1, acessibilidade 100, JS inicial ≤ 150 KB.
      - run: pnpm --filter @zuploop/web test:lighthouse
      - name: Relatórios dos testes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-reports
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/.lighthouseci
          retention-days: 7

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Histórico completo: o gitleaks procura segredos em todos os commits.
          fetch-depth: 0
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1
