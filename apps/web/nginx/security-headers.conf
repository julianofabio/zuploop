# Cabeçalhos de segurança (FDD 001 §8.5). REVISÃO HUMANA obrigatória antes de publicar.
# Incluído em cada location, porque um add_header dentro da location desliga os herdados.
# A exportação do Next.js usa scripts e estilos inline: por isso 'unsafe-inline'.
# A 005 amplia a política para anúncios e analytics; a 012, o connect-src para a API.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS só em produção (gerado pelo 40-zuploop-runtime.sh a partir de PUBLIC_ENVIRONMENT).
include /tmp/zuploop/hsts.conf;
